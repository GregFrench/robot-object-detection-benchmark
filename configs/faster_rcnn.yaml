model:
  family: faster_rcnn
  backbone: resnet50_fpn
  pretrained: true
  num_classes: 11  # 10 tabletop classes + background

training:
  epochs: 5
  batch_size: 2
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 2
  device: auto

outputs:
  checkpoint_dir: outputs/checkpoints
  metrics_dir: outputs/metrics
